    function getNowSP() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      return { isoDate: `${map.year}-${map.month}-${map.day}`, time: `${map.hour}:${map.minute}` };
    }
    function getTodayISO() { return getNowSP().isoDate; }
    function addDaysISO(isoDate, days) {
      const [y, m, d] = isoDate.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d + Number(days || 0))).toISOString().slice(0, 10);
    }
    function formatDateBR(isoDate) {
      if (!isoDate) return '—';
      const p = String(isoDate).slice(0, 10).split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : isoDate;
    }
    function formatBRL(val) { return (Number(val) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function escapeHTML(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function generateId(prefix = 'id') { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
    function cleanCNPJ(val) { return String(val || '').replace(/\D/g, '').slice(0, 14); }
    function formatCNPJ(val) {
      const d = cleanCNPJ(val);
      if (d.length <= 2) return d;
      if (d.length <= 5) return `${d.slice(0, 2)}.${d.slice(2)}`;
      if (d.length <= 8) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5)}`;
      if (d.length <= 12) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8)}`;
      return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12, 14)}`;
    }

    // IndexedDB Áudio & Mídia
    function openDB(name, store) {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(name, 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(store)) req.result.createObjectStore(store, { keyPath: 'id' }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function putDB(name, store, record) {
      const db = await openDB(name, store);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(record);
        tx.oncomplete = () => resolve(record.id);
        tx.onerror = () => reject(tx.error);
      });
    }
    async function getDB(name, store, id) {
      if (!id) return null;
      const db = await openDB(name, store);
      return new Promise((resolve) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    // Gravação de Áudio + Transcrição em Tempo Real (Web Speech API)
    function initSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const rec = new SR();
      rec.lang = 'pt-BR';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            accumulatedTranscript += (accumulatedTranscript ? ' ' : '') + text.trim();
          } else {
            interim += text;
          }
        }
        const rawBox = document.getElementById('visitRawText');
        if (rawBox) {
          rawBox.value = (accumulatedTranscript + (interim ? ' ' + interim : '')).trim();
        }
      };
      rec.onerror = (e) => console.warn('SpeechRecognition:', e.error);
      rec.onend = () => {
        if (isRecordingActive) {
          try { rec.start(); } catch (_) {}
        }
      };
      return rec;
    }

    async function startAudioRecording() {
      const badge = document.getElementById('audioStageBadge');
      const rawBox = document.getElementById('visitRawText');
      accumulatedTranscript = rawBox ? rawBox.value.trim() : '';
      isRecordingActive = true;

      // Inicia reconhecimento de voz simultâneo
      if (!speechRecognitionInstance) speechRecognitionInstance = initSpeechRecognition();
      if (speechRecognitionInstance) {
        try { speechRecognitionInstance.start(); } catch (_) {}
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (badge) badge.textContent = '🎙️ Transcrevendo voz...';
        showToast('Transcrição por voz iniciada!', 'info');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        recordingSeconds = 0;
        let options = {};
        for (const mime of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) {
          if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(mime)) { options = { mimeType: mime }; break; }
        }
        mediaRecorderInstance = new MediaRecorder(stream, options);
        mediaRecorderInstance.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data); };
        mediaRecorderInstance.onstop = async () => {
          clearInterval(recordingTimerInterval);
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recordedChunks, { type: mediaRecorderInstance.mimeType || 'audio/mp4' });
          if (blob.size > 0) {
            tempAudioId = await putDB(AUDIO_DB_NAME, AUDIO_STORE_NAME, { id: generateId('aud'), blob, mimeType: blob.type, createdAt: Date.now() });
            renderAudioPlayer(tempAudioId);
          }
          if (badge) badge.textContent = '✅ Áudio gravado e transcrito';
        };
        mediaRecorderInstance.start(500);
        if (badge) badge.textContent = '🔴 Gravando e transcrevendo...';
        document.getElementById('btnStartRec').disabled = true;
        document.getElementById('btnStopRec').disabled = false;
        recordingTimerInterval = setInterval(() => {
          recordingSeconds += 1;
          const m = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
          const s = String(recordingSeconds % 60).padStart(2, '0');
          const tEl = document.getElementById('recTimer');
          if (tEl) tEl.textContent = `${m}:${s}`;
        }, 1000);
      } catch (err) {
        console.warn(err);
        showToast('Permita o microfone no Safari para gravar e transcrever.', 'error');
      }
    }

    function stopAudioRecording() {
      isRecordingActive = false;
      if (speechRecognitionInstance) {
        try { speechRecognitionInstance.stop(); } catch (_) {}
      }
      if (mediaRecorderInstance && mediaRecorderInstance.state !== 'inactive') {
        mediaRecorderInstance.stop();
      }
      const btnStart = document.getElementById('btnStartRec');
      const btnStop = document.getElementById('btnStopRec');
      if (btnStart) btnStart.disabled = false;
      if (btnStop) btnStop.disabled = true;
      showToast('Gravação encerrada. Texto transcrito pronto!', 'success');
    }

    // IA Estruturada em 4 Blocos
    function buildLocalStructuredAI(rawText, segment, companyName, contactName, visitDate) {
      const cleaned = String(rawText || '').replace(/\s+/g, ' ').trim() || `Visita realizada em ${companyName} com foco em relacionamento comercial.`;
      const sentences = cleaned.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
      const bullets = (sentences.length ? sentences : [cleaned]).map(s => `• ${s.charAt(0).toUpperCase()}${s.slice(1)}.`).join('\n');
      const lower = cleaned.toLowerCase();
      const urgency = /amanhã|amanha|urgente|hoje/.test(lower) ? 'D+1' : /semana/.test(lower) ? 'D+7' : 'D+3';
      const days = urgency === 'D+1' ? 1 : urgency === 'D+7' ? 7 : 3;
      const suggestedDate = addDaysISO(visitDate || getTodayISO(), days);
      const responsible = /assistente|cadastro|documento/.test(lower) ? 'Assistente' : 'Gerente';
      const segInfo = SEGMENT_BENCHMARK[segment] || SEGMENT_BENCHMARK['Outros'];

      return {
        executiveReport: bullets,
        actionPlan: {
          nextAction: `Apresentar proposta e dar sequência nas demandas levantadas com ${companyName}.`,
          urgency, suggestedDate, responsible, actionStatus: 'Pendente'
        },
        commercialMapping: {
          immediateOpportunities: segInfo.immediate,
          strategicConsulting: segInfo.strategic.join(' ')
        },
        crmText: `Realizei visita comercial à ${companyName} (${segment}), junto a ${contactName || 'liderança'}. ${cleaned.endsWith('.') ? cleaned : cleaned + '.'} Retorno previsto em ${urgency} (${formatDateBR(suggestedDate)}).`
      };
    }

    function processVisitWithAI() {
      const rawText = document.getElementById('visitRawText')?.value || '';
      const segment = document.getElementById('visitSegmentSelect')?.value || 'Outros';
      const companyId = document.getElementById('visitCompanySelect')?.value || '';
      const company = getActiveCompanies().find(c => c.id === companyId);
      const companyName = company ? (company.tradeName || company.legalName) : 'Empresa PJ';
      const contactName = document.getElementById('visitContactInput')?.value?.trim() || company?.contactName || '';
      const visitDate = document.getElementById('visitDateInput')?.value || getTodayISO();

      const ai = buildLocalStructuredAI(rawText, segment, companyName, contactName, visitDate);
      document.getElementById('outExecutiveReport').value = ai.executiveReport;
      document.getElementById('outNextAction').value = ai.actionPlan.nextAction;
      document.getElementById('outUrgency').value = ai.actionPlan.urgency;
      document.getElementById('outSuggestedDate').value = ai.actionPlan.suggestedDate;
      document.getElementById('outResponsible').value = ai.actionPlan.responsible;

      document.getElementById('outStrategicConsulting').value = ai.commercialMapping.strategicConsulting;
      document.getElementById('outCrmText').value = ai.crmText;
      showToast('Transcrição organizada nos 4 blocos!', 'success');
    }

    // Filtro de Período
    function filterByPeriod(items, dateField) {
      const p = appState.globalPeriod;
      const today = getTodayISO();
      const q = (document.getElementById('quickCompanySearch')?.value || '').toLowerCase().trim();
      const companies = getActiveCompanies();

      return (items || []).filter(item => {
        if (q) {
          const comp = companies.find(c => c.id === item.companyId) || item;
          const hay = `${comp.tradeName || ''} ${comp.legalName || ''} ${comp.cnpj || ''} ${item.rawText || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        const d = String(item[dateField] || '').slice(0, 10);
        if (!d || p === 'todo-historico') return true;
        if (p === 'hoje') return d === today;
        if (p === 'ontem') return d === addDaysISO(today, -1);
        if (p === 'esta-semana') return d >= addDaysISO(today, -7) && d <= today;
        if (p === 'este-mes') return d.slice(0, 7) === today.slice(0, 7);
        if (p === 'personalizado') return d >= appState.customStartDate && d <= appState.customEndDate;
        return true;
      });
    }

    // Ações e Eventos
    function saveCompanyForm(e) {
      e.preventDefault();
      const store = getActiveStore();
      const comp = {
        id: generateId('comp'),
        cnpj: document.getElementById('compCnpj').value.trim(),
        tradeName: document.getElementById('compTradeName').value.trim(),
        legalName: document.getElementById('compLegalName').value.trim(),
        segment: document.getElementById('compSegment').value,
        classification: document.getElementById('compClass').value,
        address: document.getElementById('compAddress').value.trim(),
        city: document.getElementById('compCity').value.trim(),
        state: document.getElementById('compState').value.trim(),
        contactName: document.getElementById('compContactName').value.trim(),
        whatsapp: document.getElementById('compWhatsapp').value.trim(),
        cnae: document.getElementById('compCnae').value.trim()
      };
      store.companies.unshift(comp);
      persistState();
      showToast('Empresa cadastrada com sucesso!', 'success');
      renderCurrentView();
    }

    function saveVisitForm(e) {
      e.preventDefault();
      const store = getActiveStore();
      const companyId = document.getElementById('visitCompanySelect').value;
      const segment = document.getElementById('visitSegmentSelect').value;
      const visitDate = document.getElementById('visitDateInput').value;
      const nextAction = document.getElementById('outNextAction').value.trim();
      const suggestedDate = document.getElementById('outSuggestedDate').value;
      const urgency = document.getElementById('outUrgency').value;

      if (!document.getElementById('outExecutiveReport').value.trim()) {
        processVisitWithAI();
      }

      const visitId = generateId('vis');
      store.visits.unshift({
        id: visitId,
        visitNumber: store.visits.length + 1,
        companyId,
        segment,
        visitType: document.getElementById('visitTypeSelect').value,
        visitDate,
        visitTime: document.getElementById('visitTimeInput').value,
        personMet: document.getElementById('visitContactInput').value.trim(),
        channel: document.getElementById('visitChannelSelect').value,
        status: 'concluida',
        audioId: tempAudioId,
        mediaIds: [...tempMediaIds],
        rawText: document.getElementById('visitRawText').value.trim(),
        executiveReport: document.getElementById('outExecutiveReport').value.trim(),
        crmText: document.getElementById('outCrmText').value.trim()
      });

      if (nextAction) {
        store.commitments.unshift({
          id: generateId('cmt'),
          visitId,
          companyId,
          description: nextAction,
          dueDate: suggestedDate || addDaysISO(visitDate, 3),
          urgency,
          responsible: 'Gerente',
          status: 'Pendente'
        });
      }

      const oppsRaw = document.getElementById('outImmediateOpps').value.split(',').map(s => s.trim()).filter(Boolean);
      oppsRaw.forEach(prod => {
        store.opportunities.unshift({
          id: generateId('opp'),
          visitId,
          companyId,
          segment,
          product: prod,
          potentialValue: 0,
          stage: 'Identificada',
          dueDate: suggestedDate || addDaysISO(visitDate, 3),
          status: 'Ativa'
        });
      });

      tempAudioId = null;
      tempMediaIds = [];
      persistState();
      showToast('Visita salva com sucesso!', 'success');
      navigateTo('historico');
    }

    function onVisitCompanyChange(companyId) {
      const c = getActiveCompanies().find(x => x.id === companyId);
      if (!c) return;
      document.getElementById('visitSegmentSelect').value = c.segment || 'Outros';
      document.getElementById('visitContactInput').value = c.contactName || '';
      updateQuestionsGuide();
    }

    function updateQuestionsGuide() {
      const seg = document.getElementById('visitSegmentSelect')?.value || 'Outros';
      const list = document.getElementById('segmentQuestionsList');
      if (list) {
        list.innerHTML = (SEGMENT_QUESTIONS[seg] || SEGMENT_QUESTIONS['Outros']).map(q => `<li>${escapeHTML(q)}</li>`).join('');
      }
    }

    function startVisitForCompany(companyId) {
      navigateTo('nova-visita');
      setTimeout(() => {
        const sel = document.getElementById('visitCompanySelect');
        if (sel) { sel.value = companyId; onVisitCompanyChange(companyId); }
      }, 30);
    }

    function completeCommitment(id) {
      const item = (getActiveStore().commitments || []).find(c => c.id === id);
      if (item) { item.status = 'Concluído'; persistState(); renderCurrentView(); showToast('Retorno concluído!', 'success'); }
    }

    function saveSettingsForm(e) {
      e.preventDefault();
      appState.settings.managerName = document.getElementById('setManagerName').value.trim();
      appState.settings.institution = document.getElementById('setInstitution').value.trim();
      appState.settings.unit = document.getElementById('setUnit').value.trim();
      appState.settings.gestor = document.getElementById('setGestor').value.trim();
      document.getElementById('headerManagerName').textContent = appState.settings.managerName;
      persistState();
      showToast('Configurações salvas!', 'success');
    }

    function toggleDemoMode() {
      appState.demoMode = !appState.demoMode;
      persistState();
      syncShellUI();
      renderCurrentView();
    }

    function confirmClearDemoData() {
      appState.demo = createDemoStore();
      persistState();
      renderCurrentView();
      showToast('Dados de demonstração restaurados.', 'info');
    }

    function exportBackupJSON() {
      const payload = {
        app: 'GestaoInteligenteVisitasPJ_CredFoz',
        version: '2.1',
        exportedAtISO: new Date().toISOString(),
        settings: appState.settings,
        production: appState.production,
        demo: appState.demo
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup-visitas-pj-${getTodayISO()}.json`;
      a.click();
    }

    function importBackupJSON(inputEl) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (parsed.settings) appState.settings = { ...appState.settings, ...parsed.settings };
          if (parsed.production) appState.production = parsed.production;
          if (parsed.demo) appState.demo = parsed.demo;
          persistState();
          syncShellUI();
          renderCurrentView();
          showToast('Backup JSON importado com sucesso!', 'success');
        } catch (err) {
          showToast('Arquivo JSON inválido.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function openDailyClosingModal() {
      const visitsToday = getActiveStore().visits.filter(v => v.visitDate === getTodayISO());
      openModal('Fechamento do Dia', `
        <p class="text-xs text-slate-600 dark:text-slate-300">Resumo de <strong>${formatDateBR(getTodayISO())}</strong> (${escapeHTML(appState.settings.managerName)}):</p>
        <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs space-y-1">
          <div><strong>Visitas realizadas hoje:</strong> ${visitsToday.length}</div>
          ${visitsToday.map(v => {
            const c = getActiveCompanies().find(x => x.id === v.companyId);
            return `<div>• ${escapeHTML(c?.tradeName || 'Empresa')}: ${escapeHTML(v.crmText || v.rawText)}</div>`;
          }).join('')}
        </div>
      `);
    }

    function handleGlobalPeriodChange(val) {
      appState.globalPeriod = val;
      document.getElementById('customPeriodInputs').classList.toggle('hidden', val !== 'personalizado');
      persistState();
      renderCurrentView();
    }

    function toggleDarkMode() {
      appState.darkMode = !appState.darkMode;
      document.documentElement.classList.toggle('dark', appState.darkMode);
      persistState();
    }

    function navigateTo(mod) {
      appState.currentModule = mod;
      persistState();
      syncShellUI();
      renderCurrentView();
    }

    function syncShellUI() {
      document.documentElement.classList.toggle('dark', appState.darkMode);
      document.getElementById('headerManagerName').textContent = appState.settings.managerName;
      document.getElementById('demoBanner').classList.toggle('hidden', !appState.demoMode);
      document.getElementById('demoBadgeHeader').classList.toggle('hidden', !appState.demoMode);
      document.getElementById('globalPeriodSelect').value = appState.globalPeriod;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.dataset.nav === appState.currentModule;
        btn.classList.toggle('bg-ailosBlue-700', active);
        btn.classList.toggle('text-white', active);
      });
    }

    function renderCurrentView() {
      const container = document.getElementById('appContainer');
      const m = appState.currentModule;
      if (m === 'empresas') container.innerHTML = renderEmpresasView();
      else if (m === 'nova-visita') container.innerHTML = renderNovaVisitaView();
      else if (m === 'historico') container.innerHTML = renderHistoricoView();
      else if (m === 'oportunidades') container.innerHTML = renderOportunidadesView();
      else if (m === 'agenda') container.innerHTML = renderAgendaView();
      else if (m === 'relatorios') container.innerHTML = renderRelatoriosView();
      else if (m === 'configuracoes') container.innerHTML = renderConfiguracoesView();
      else container.innerHTML = renderPainelView();
    }

    syncShellUI();
    renderCurrentView();
  </script>
</body>
</html>
