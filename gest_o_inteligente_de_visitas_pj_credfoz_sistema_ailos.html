    function openStateDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB indisponível.'));
          return;
        }
        const req = indexedDB.open(STATE_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STATE_STORE_NAME)) {
            db.createObjectStore(STATE_STORE_NAME, { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function persistStateToIndexedDB(stateObj) {
      try {
        const db = await openStateDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STATE_STORE_NAME, 'readwrite');
          tx.objectStore(STATE_STORE_NAME).put({ key: STORAGE_KEY, value: stateObj, updatedAt: Date.now() });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.warn('Backup IndexedDB indisponível:', err);
        return false;
      }
    }

    async function hydrateStateFromIndexedDB() {
      try {
        const db = await openStateDB();
        const record = await new Promise((resolve, reject) => {
          const tx = db.transaction(STATE_STORE_NAME, 'readonly');
          const req = tx.objectStore(STATE_STORE_NAME).get(STORAGE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
        if (record && record.value) {
          const localRaw = localStorage.getItem(STORAGE_KEY);
          const dbCompaniesCount = (record.value.production?.companies?.length || 0) + (record.value.demo?.companies?.length || 0);
          const localCompaniesCount = (appState.production?.companies?.length || 0) + (appState.demo?.companies?.length || 0);
          if (!localRaw || dbCompaniesCount >= localCompaniesCount) {
            appState = {
              ...appState,
              ...record.value,
              settings: { ...appState.settings, ...(record.value.settings || {}) },
              production: record.value.production || appState.production,
              demo: record.value.demo || appState.demo
            };
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (_) {}
          }
        }
      } catch (err) {
        console.warn('Falha ao hidratar IndexedDB:', err);
      }
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Aviso localStorage:', e);
      }
      persistStateToIndexedDB(appState);
    }

      return appState.demoMode ? appState.demo : appState.production;

    function getNowSP() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIMEZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);

      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      return {
        isoDate: `${map.year}-${map.month}-${map.day}`,
        time: `${map.hour}:${map.minute}`
      };
    }

    function getTodayISO() {
      return getNowSP().isoDate;
    }

    function addDaysISO(isoDate, days) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + Number(days || 0)));
      return dt.toISOString().slice(0, 10);
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '—';
      const parts = String(isoDate).slice(0, 10).split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatBRL(val) {
      const num = Number(val) || 0;
      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function parseBRLInput(val) {
      if (typeof val === 'number') return isFinite(val) ? val : 0;
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return 0;
      return Number(digits) / 100;
    }

    function formatBRLInputFromNumber(num) {
      const n = Number(num) || 0;
      if (!n) return '';
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function applyCurrencyMask(inputEl) {
      if (!inputEl) return;
      const digits = String(inputEl.value || '').replace(/\D/g, '');
      if (!digits) {
        inputEl.value = '';
        return;
      }
      const numeric = Number(digits) / 100;
      inputEl.value = numeric.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateId(prefix = 'id') {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    // =========================================================================
    // 4. MÁSCARA DE CNPJ EM TEMPO REAL + CONSULTA BRASILAPI (14 DÍGITOS)
    // =========================================================================
    function cleanCNPJ(val) {
      return String(val || '').replace(/\D/g, '').slice(0, 14);
    }

    function formatCNPJ(val) {
      const d = cleanCNPJ(val);
      if (!d) return '';
      if (d.length <= 2) return d;
      if (d.length <= 5) return `${d.slice(0, 2)}.${d.slice(2)}`;
      if (d.length <= 8) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5)}`;
      if (d.length <= 12) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8)}`;
      return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12, 14)}`;
    }

    function applyCnpjMask(inputEl) {
      if (!inputEl) return;
      const formatted = formatCNPJ(inputEl.value);
      if (inputEl.value !== formatted) {
        inputEl.value = formatted;
      }
    }

    function mapCnaeToSegment(cnaeDesc = '') {
      const txt = String(cnaeDesc).toLowerCase();
      if (/constru|obra|alvenaria|edifica|engenharia civil|terraplenagem/.test(txt)) return 'Construção Civil';
      if (/saúde|saude|médic|medic|odonto|clínic|clinic|hospital|laboratór|farmácia|farmacia/.test(txt)) return 'Saúde';
      if (/software|tecnologia|sistemas|informática|informatica|dados|internet|desenvolvimento/.test(txt)) return 'Tecnologia';
      if (/agrícol|agricol|pecuár|pecuar|agro|lavoura|gado|sementes/.test(txt)) return 'Agronegócio';
      if (/indústri|industri|fábric|fabrica|manufatura|metalúrg|metalurg|confecç|confecc/.test(txt)) return 'Indústria/Fábrica';
      if (/comércio|comercio|varej|atacad|loja|mercado|materiais/.test(txt)) return 'Comércio';
      if (/serviç|servic|consultoria|assessoria|limpeza|manutenção|manutencao|transporte/.test(txt)) return 'Serviços';
      return 'Outros';
    }

    let lastConsultedCnpj = '';

    async function handleCnpjInputWithLookup(inputEl, statusElId = 'cnpjLookupStatus') {
      applyCnpjMask(inputEl);
      const cnpj = cleanCNPJ(inputEl.value);
      const statusEl = document.getElementById(statusElId);

      if (cnpj.length < 14) {
        if (statusEl && cnpj.length === 0) statusEl.textContent = '';
        return;
      }

      if (cnpj === lastConsultedCnpj) return;
      lastConsultedCnpj = cnpj;

      if (statusEl) {
        statusEl.textContent = '⏳ Consultando dados oficiais do CNPJ...';
        statusEl.className = 'text-[11px] font-semibold text-ailosBlue-600 dark:text-sky-400 mt-1';
      }

      try {
        const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
        if (!res.ok) {
          throw new Error('CNPJ não encontrado na base pública ou indisponível no momento.');
        }
        const data = await res.json();

        preencherFormularioPJ({
          razaoSocial: data.razao_social || '',
          nomeFantasia: data.nome_fantasia || data.razao_social || '',
          situacaoCadastral: data.descricao_situacao_cadastral || '',
          cep: data.cep ? String(data.cep).replace(/\D/g, '') : '',
          logradouro: data.logradouro || '',
          numero: data.numero || '',
          complemento: data.complemento || '',
          bairro: data.bairro || '',
          municipio: data.municipio || '',
          uf: data.uf || '',
          cnaePrincipal: data.cnae_fiscal_descricao || '',
          qsa: Array.isArray(data.qsa) ? data.qsa : []
        });

        if (statusEl) {
          const sit = data.descricao_situacao_cadastral ? ` • Situação: ${data.descricao_situacao_cadastral}` : '';
          statusEl.textContent = `✅ Dados preenchidos via consulta automática${sit}`;
          statusEl.className = 'text-[11px] font-semibold text-tealCooper-700 dark:text-tealCooper-400 mt-1';
        }
        updateCompanyGoogleMapsPreview();
        showToast('Dados do CNPJ carregados com sucesso!', 'success');
      } catch (err) {
        console.warn('Consulta CNPJ:', err);
        if (statusEl) {
          statusEl.textContent = '⚠️ Consulta automática indisponível para este CNPJ. Preencha os campos manualmente.';
          statusEl.className = 'text-[11px] font-semibold text-amber-700 dark:text-amber-400 mt-1';
        }
      }
    }

    function preencherFormularioPJ(info = {}) {
      const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el && val !== undefined && val !== null && String(val).trim() !== '') {
          el.value = String(val).trim();
        }
      };

      setVal('compLegalName', info.razaoSocial);
      setVal('compTradeName', info.nomeFantasia || info.razaoSocial);
      setVal('compSituation', info.situacaoCadastral);
      setVal('compCep', info.cep);
      setVal('compAddress', info.logradouro);
      setVal('compNumber', info.numero);
      setVal('compComplement', info.complemento);
      setVal('compNeighborhood', info.bairro);
      setVal('compCity', info.municipio);
      setVal('compState', info.uf);
      setVal('compCnae', info.cnaePrincipal);

      const segEl = document.getElementById('compSegment');
      if (segEl && !segEl.value && info.cnaePrincipal) {
        segEl.value = mapCnaeToSegment(info.cnaePrincipal);
      }
      updateCompanyGoogleMapsPreview();
      if (Array.isArray(info.qsa) && info.qsa.length > 0) {
        const lead = info.qsa[0];
        const partnerName = lead.nome_socio || lead.razao_social_socio || '';
        const partnerRole = lead.qualificacao_socio || 'Sócio';
        if (partnerName) {
          setVal('compContactName', partnerName);
          setVal('compContactRole', partnerRole);
        }
        window.__loadedQsaPartners = info.qsa.map(s => ({
          name: s.nome_socio || s.razao_social_socio || 'Sócio',
          role: s.qualificacao_socio || 'Sócio',
          share: s.percentual_capital_social ? `${s.percentual_capital_social}%` : '',
          decisionMaker: true
        }));
      }
    }

    function compressImageBlobToDataUrl(blobOrFile, maxWidth = 1024, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            try {
              let width = img.width || maxWidth;
              let height = img.height || maxWidth;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(dataUrl);
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = () => reject(new Error('Falha ao decodificar imagem para compressão.'));
          img.src = String(reader.result || '');
        };
        reader.onerror = () => reject(new Error('Falha ao ler arquivo de imagem.'));
        reader.readAsDataURL(blobOrFile);
      });
    }

    function dataUrlToBlob(dataUrl, fallbackMime = 'image/jpeg') {
      const parts = String(dataUrl || '').split(',');
      if (parts.length < 2) return new Blob([], { type: fallbackMime });
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : fallbackMime;
      const bstr = atob(parts[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    async function getMediaFromDB(id) {
      if (!id) return null;
      const db = await openMediaDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(MEDIA_STORE_NAME, 'readonly');
        const req = tx.objectStore(MEDIA_STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteMediaFromDB(id) {
      if (!id) return;
      try {
        const db = await openMediaDB();
        const tx = db.transaction(MEDIA_STORE_NAME, 'readwrite');
        tx.objectStore(MEDIA_STORE_NAME).delete(id);
      } catch (e) {
        console.warn('Erro ao remover mídia:', e);
      }
    }

    async function startAudioRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Seu navegador não suporta captura de microfone. Use "Anexar áudio" ou digite o relato.', 'warn');
        return;
      }

      try {
        setAudioStageBadge('Solicitando microfone...');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        recordingSeconds = 0;
        isPausedRecording = false;

        let options = {};
        if (typeof MediaRecorder !== 'undefined') {
          const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
          for (const mime of candidates) {
            if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mime)) {
              options = { mimeType: mime };
              break;
            }
          }
          mediaRecorderInstance = new MediaRecorder(stream, options);
        } else {
          showToast('Gravação direta não suportada neste aparelho. Utilize "Anexar áudio".', 'warn');
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        mediaRecorderInstance.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) {
            recordedChunks.push(ev.data);
          }
        };

        mediaRecorderInstance.onstop = async () => {
          clearInterval(recordingTimerInterval);
          stream.getTracks().forEach(t => t.stop());
          const mime = mediaRecorderInstance.mimeType || 'audio/mp4';
          const blob = new Blob(recordedChunks, { type: mime });
          if (blob.size > 0) {
            const audioId = await saveAudioBlobToDB(blob, mime);
            tempAudioId = audioId;
            await renderAudioPreviewPlayer(audioId);
            setAudioStageBadge('Áudio salvo');
            saveDraftVisit(false);
            showToast('Áudio gravado e salvo com segurança!', 'success');
          } else {
            setAudioStageBadge('Aguardando gravação');
          }
          updateRecorderButtonsUI('idle');
        };

        mediaRecorderInstance.start(500);
        setAudioStageBadge('🔴 Gravando');
        updateRecorderButtonsUI('recording');

        recordingTimerInterval = setInterval(() => {
          if (!isPausedRecording) {
            recordingSeconds += 1;
            const timerEl = document.getElementById('recTimer');
            if (timerEl) timerEl.textContent = formatTimer(recordingSeconds);
          }
        }, 1000);
      } catch (err) {
        console.error('Erro microfone:', err);
        setAudioStageBadge('Permissão negada / indisponível');
        updateRecorderButtonsUI('idle');
        showToast('Permita o acesso ao microfone no Safari ou use "Anexar áudio".', 'error');
      }
    }

    function togglePauseAudioRecording() {
      if (!mediaRecorderInstance) return;
      if (mediaRecorderInstance.state === 'recording' && typeof mediaRecorderInstance.pause === 'function') {
        mediaRecorderInstance.pause();
        isPausedRecording = true;
        setAudioStageBadge('⏸ Pausado');
        updateRecorderButtonsUI('paused');
      } else if (mediaRecorderInstance.state === 'paused' && typeof mediaRecorderInstance.resume === 'function') {
        mediaRecorderInstance.resume();
        isPausedRecording = false;
        setAudioStageBadge('🔴 Gravando');
        updateRecorderButtonsUI('recording');
      }
    }

    function stopAudioRecording() {
      if (mediaRecorderInstance && mediaRecorderInstance.state !== 'inactive') {

        mediaRecorderInstance.stop();
      }
    }

    function cleanSpokenText(text) {
      return String(text || '')
        .replace(/\b(tipo assim|né|tá|ta|ahn|éé|uhum|bom|então assim)\b/gi, ' ')
        .replace(/\b(\w+)\s+\1\b/gi, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectUrgencyAndDate(text, baseDate) {
      const t = String(text || '').toLowerCase();
      if (/amanhã|amanha|urgente|hoje|d\+1|imediato/.test(t)) {
        return { urgency: 'D+1', suggestedDate: addDaysISO(baseDate, 1) };
      }
      if (/semana que vem|próxima semana|proxima semana|d\+7|7 dias/.test(t)) {
        return { urgency: 'D+7', suggestedDate: addDaysISO(baseDate, 7) };
      }
      return { urgency: 'D+3', suggestedDate: addDaysISO(baseDate, 3) };
    }

    function detectResponsible(text) {
      const t = String(text || '').toLowerCase();
      if (/assistente|cadastro|documenta|documento|cobrar doc|planilha|conferir/.test(t)) {
        return 'Assistente';
      }
      return 'Gerente';
    }

    function buildLocalStructuredAI(rawText, segment, companyName, contactName, visitDate) {
      const cleaned = cleanSpokenText(rawText) || `Visita realizada em ${companyName || 'empresa PJ'} com foco em relacionamento e mapeamento de soluções financeiras.`;
      const sentences = cleaned.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
      const bullets = (sentences.length ? sentences : [cleaned]).map(s => `• ${s.charAt(0).toUpperCase()}${s.slice(1)}.`).join('\n');

      const { urgency, suggestedDate } = detectUrgencyAndDate(cleaned, visitDate || getTodayISO());
      const responsible = detectResponsible(cleaned);

      const segInfo = SEGMENT_BENCHMARK[segment] || SEGMENT_BENCHMARK['Outros'];
      const lower = cleaned.toLowerCase();
      const immediateFound = [];

      if (/máquina|maquininha|adquirência|adquirencia|cartão|cartao|taxa/.test(lower)) immediateFound.push('Adquirência / Maquininhas de cartão');
      if (/conta|abrir conta|domicílio|domicilio/.test(lower)) immediateFound.push('Conta PJ / Domicílio bancário');
      if (/antecip|recebível|recebivel|boleto|cobrança|cobranca/.test(lower)) immediateFound.push('Antecipação de recebíveis / Cobrança');
      if (/capital de giro|giro|crédito|credito|financiamento|caminhão|caminhao|consórcio|consorcio/.test(lower)) immediateFound.push('Solução de crédito / Consórcio');
      if (/seguro|previdência|previdencia|aplicação|aplicacao|investimento/.test(lower)) immediateFound.push('Proteção / Investimentos');

      const immediateList = immediateFound.length ? immediateFound : segInfo.immediate;

      const nextAction = responsible === 'Assistente'
        ? `Conferir cadastro, solicitar documentação pendente e apoiar o preparo da proposta para ${companyName || 'a empresa'}.`
        : `Apresentar proposta comercial e condições para ${companyName || 'a empresa'} (${immediateList[0] || 'soluções PJ'}).`;

      const contactRef = contactName ? `junto a ${contactName}` : 'com a liderança da empresa';
      const crmText = `Realizei atendimento comercial referente à empresa ${companyName || 'PJ'} (${segment || 'Outros'}), ${contactRef}. ${cleaned.endsWith('.') ? cleaned : cleaned + '.'} Direcionamento definido em ${urgency} (${formatDateBR(suggestedDate)}) sob responsabilidade do ${responsible}.`;

      return {
        executiveReport: bullets,
        actionPlan: {
          nextAction,
          urgency,
          suggestedDate,
          responsible,
          actionStatus: 'Pendente'
        },
        commercialMapping: {
          immediateOpportunities: immediateList,
          strategicConsulting: segInfo.strategic.join(' ')
        },
        crmText
      };
    }

    async function processVisitWithAI() {
      const rawInput = document.getElementById('visitRawText');
      const segment = document.getElementById('visitSegmentSelect')?.value || 'Outros';
      const companyId = document.getElementById('visitCompanySelect')?.value || '';
      const company = getActiveCompanies().find(c => c.id === companyId);
      const companyName = company ? (company.tradeName || company.legalName) : 'Empresa PJ';
      const contactName = document.getElementById('visitContactInput')?.value?.trim() || company?.contactName || '';
      const visitDate = document.getElementById('visitDateInput')?.value || getTodayISO();

      let textToProcess = rawInput?.value?.trim() || '';

      setAudioStageBadge('Analisando');

      // Se houver áudio mas nenhum texto digitado ainda, tenta usar Web Speech API ou orienta transcrição
      if (!textToProcess && tempAudioId) {
        textToProcess = `Relato de voz gravado após visita à ${companyName} (${segment}). Revisar detalhes específicos e ajustar os 4 blocos conforme necessário.`;
        if (rawInput) rawInput.value = textToProcess;
      }

      if (!textToProcess) {
        setAudioStageBadge('Aguardando gravação');
        showToast('Grave um áudio ou digite o relato da visita antes de processar.', 'warn');
        return;
      }

      const apiKey = (appState.settings?.geminiApiKey || '').trim();
      let structured = null;

      if (apiKey) {
        try {
          setAudioStageBadge('Transcrevendo / IA...');
          const prompt = `Você é um assistente sênior de inteligência comercial para um Gerente de Negócios PJ da CredFoz (Sistema Ailos).
Analise o relato abaixo e retorne EXCLUSIVAMENTE um JSON válido com as chaves:
{
  "executiveReport": "relato executivo limpo, sem vícios de linguagem, em tópicos com •",
  "nextAction": "próxima ação objetiva",
  "urgency": "D+1" ou "D+3" ou "D+7",
  "responsible": "Gerente" ou "Assistente",
  "immediateOpportunities": ["oportunidade 1", "oportunidade 2"],
  "strategicConsulting": "consultoria estratégica de benchmarking para o segmento ${segment}",
  "crmText": "texto executivo pronto para CRM, profissional, sem emojis, em primeira pessoa"
}
Segmento: ${segment}
Empresa: ${companyName}
Contato: ${contactName || 'Não informado'}
Data da visita: ${visitDate}
Relato: ${textToProcess}`;

          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });

          if (resp.ok) {
            const data = await resp.json();
            const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawJson) {
              const parsed = JSON.parse(rawJson);
              const urg = ['D+1', 'D+3', 'D+7'].includes(parsed.urgency) ? parsed.urgency : 'D+3';
              const days = urg === 'D+1' ? 1 : urg === 'D+7' ? 7 : 3;
              structured = {
                executiveReport: parsed.executiveReport || '',
                actionPlan: {
                  nextAction: parsed.nextAction || '',
                  urgency: urg,
                  suggestedDate: addDaysISO(visitDate, days),
                  responsible: parsed.responsible === 'Assistente' ? 'Assistente' : 'Gerente',
                  actionStatus: 'Pendente'
                },
                commercialMapping: {
                  immediateOpportunities: Array.isArray(parsed.immediateOpportunities) ? parsed.immediateOpportunities : [],
                  strategicConsulting: parsed.strategicConsulting || ''
                },
                crmText: parsed.crmText || ''
              };
            }
          }
        } catch (err) {
          console.warn('Fallback para análise local:', err);
        }
      }

      if (!structured) {
        structured = buildLocalStructuredAI(textToProcess, segment, companyName, contactName, visitDate);
      }

      populateStructuredAIBlocks(structured);
      setAudioStageBadge('Aguardando revisão');
      saveDraftVisit(false);
      showToast('Relato estruturado em 4 blocos editáveis!', 'success');
    }

    function getDateRangeForPeriod(period = appState.globalPeriod) {
      const today = getTodayISO();
      const [y, m, d] = today.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));

      if (period === 'hoje') return { start: today, end: today };
      if (period === 'ontem') {
        const yest = addDaysISO(today, -1);
        return { start: yest, end: yest };
      }
      if (period === 'esta-semana') {
        const dow = dt.getUTCDay(); // 0 dom .. 6 sab
        const diffToMon = dow === 0 ? -6 : 1 - dow;
        return { start: addDaysISO(today, diffToMon), end: addDaysISO(today, diffToMon + 6) };
      }
      if (period === 'semana-anterior') {
        const dow = dt.getUTCDay();
        const diffToMon = dow === 0 ? -6 : 1 - dow;
        const startPrev = addDaysISO(today, diffToMon - 7);
        return { start: startPrev, end: addDaysISO(startPrev, 6) };
      }
      if (period === 'este-mes') {
        return { start: `${y}-${String(m).padStart(2, '0')}-01`, end: `${y}-${String(m).padStart(2, '0')}-31` };
      }
      if (period === 'mes-anterior') {
        const prevM = m === 1 ? 12 : m - 1;
        const prevY = m === 1 ? y - 1 : y;
        return { start: `${prevY}-${String(prevM).padStart(2, '0')}-01`, end: `${prevY}-${String(prevM).padStart(2, '0')}-31` };
      }
      if (period === 'este-trimestre') {
        const qStartMonth = Math.floor((m - 1) / 3) * 3 + 1;
        return { start: `${y}-${String(qStartMonth).padStart(2, '0')}-01`, end: `${y}-12-31` };
      }
      if (period === 'este-semestre') {
        const sStart = m <= 6 ? '01-01' : '07-01';
        const sEnd = m <= 6 ? '06-30' : '12-31';
        return { start: `${y}-${sStart}`, end: `${y}-${sEnd}` };
      }
      if (period === 'este-ano') {
        return { start: `${y}-01-01`, end: `${y}-12-31` };
      }
      if (period === 'personalizado') {
        return {
          start: document.getElementById('customStartDate')?.value || appState.customStartDate || today,
          end: document.getElementById('customEndDate')?.value || appState.customEndDate || today
        };
      }
      return { start: '0000-01-01', end: '9999-12-31' };
    }

    function isDateInRange(isoDate, range) {
      if (!isoDate) return false;
      const d = String(isoDate).slice(0, 10);
      return d >= range.start && d <= range.end;
    }

    function getActiveCompanies() {
      const store = getActiveStore();
      const q = (document.getElementById('quickCompanySearch')?.value || '').trim().toLowerCase();
      const qDigits = cleanCNPJ(q);
      const list = store.companies || [];
      if (!q) return list;
      return list.filter(c => {
        const nameMatch = (c.tradeName || '').toLowerCase().includes(q) || (c.legalName || '').toLowerCase().includes(q) || (c.segment || '').toLowerCase().includes(q);
        const cnpjMatch = qDigits.length > 0 && cleanCNPJ(c.cnpj).includes(qDigits);
        return nameMatch || cnpjMatch;
      });
    }

    function getFilteredVisits() {
      const store = getActiveStore();
      const range = getDateRangeForPeriod();
      const q = (document.getElementById('quickCompanySearch')?.value || '').trim().toLowerCase();
      const qDigits = cleanCNPJ(q);

      return (store.visits || []).filter(v => {
        if (v.status !== 'concluida') return false;
        if (!isDateInRange(v.visitDate, range)) return false;
        if (!q) return true;
        const comp = (store.companies || []).find(c => c.id === v.companyId);
        const compName = `${comp?.tradeName || ''} ${comp?.legalName || ''} ${v.segment || ''} ${v.personMet || ''}`.toLowerCase();
        const cnpjMatch = qDigits.length > 0 && cleanCNPJ(comp?.cnpj || '').includes(qDigits);
        return compName.includes(q) || cnpjMatch;
      });
    }

    function computeDashboardMetrics() {
      const store = getActiveStore();
      const visits = getFilteredVisits();
      const today = getTodayISO();

      const totalVisits = visits.length;
      const prospectingCount = visits.filter(v => v.visitType === 'Prospecção').length;
      const maintenanceCount = visits.filter(v => v.visitType === 'Manutenção de cooperado').length;
      const distinctCompanyIds = new Set(visits.map(v => v.companyId));
      const distinctCompaniesCount = distinctCompanyIds.size;

      const activeOpps = (store.opportunities || []).filter(o => o.status === 'Ativa');
      const totalPotential = activeOpps.reduce((acc, o) => acc + (Number(o.potentialValue) || 0), 0);

      const openCommitments = (store.commitments || []).filter(c => c.status !== 'Concluído');
      const overdueCommitments = openCommitments.filter(c => c.dueDate && c.dueDate < today);

      return {
        totalVisits,
        prospectingCount,
        maintenanceCount,
        distinctCompaniesCount,
        opportunitiesCount: activeOpps.length,
        totalPotential,
        pendingCommitmentsCount: openCommitments.length,
        overdueCommitmentsCount: overdueCommitments.length,
        visits,
        activeOpps,
        openCommitments,
        overdueCommitments
      };
    }

        .filter(Boolean);
      if (parts.length === 0) return '';
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(parts.join(', '))}`;
    }

    function submitCompanyForm(existingId = '') {
      const tradeName = document.getElementById('compTradeName')?.value?.trim() || '';
      const segment = document.getElementById('compSegment')?.value?.trim() || '';
      if (!tradeName) {
        showToast('Informe o nome da empresa.', 'warn');
        return;
      }
      if (!segment) {
        showToast('Selecione o segmento de atuação.', 'warn');
        return;
      }

      const rawCnpj = document.getElementById('compCnpj')?.value || '';
      const digits = cleanCNPJ(rawCnpj);
      const formattedCnpj = digits ? formatCNPJ(digits) : '';

      const store = getActiveStore();
      store.companies = store.companies || [];

      if (digits.length === 14) {
        const dup = store.companies.find(c => cleanCNPJ(c.cnpj) === digits && c.id !== existingId);
        if (dup) {
          showToast(`Já existe empresa cadastrada com o CNPJ ${formattedCnpj} (${dup.tradeName}).`, 'warn');
          return;
        }
      }

      const companyRecord = {
        id: existingId || generateId('comp'),
        tradeName,
        legalName: document.getElementById('compLegalName')?.value?.trim() || tradeName,
        cnpj: formattedCnpj,
        situation: document.getElementById('compSituation')?.value?.trim() || '',
        segment,
        classification: document.getElementById('compClass')?.value || 'prospecto',
        monthlyRevenue: parseBRLInput(document.getElementById('compMonthlyRev')?.value || ''),
        employees: Number(document.getElementById('compEmployees')?.value) || 0,
        cep: document.getElementById('compCep')?.value?.trim() || '',
        address: document.getElementById('compAddress')?.value?.trim() || '',
        number: document.getElementById('compNumber')?.value?.trim() || '',
        complement: document.getElementById('compComplement')?.value?.trim() || '',
        neighborhood: document.getElementById('compNeighborhood')?.value?.trim() || '',
        city: document.getElementById('compCity')?.value?.trim() || '',
        state: (document.getElementById('compState')?.value?.trim() || '').toUpperCase(),
        cnae: document.getElementById('compCnae')?.value?.trim() || '',
        notes: document.getElementById('compNotes')?.value?.trim() || '',
        contactName: document.getElementById('compContactName')?.value?.trim() || '',
        contactRole: document.getElementById('compContactRole')?.value?.trim() || 'Sócio-administrador',
        partners: Array.isArray(window.__loadedQsaPartners) ? window.__loadedQsaPartners : []
      };

      if (existingId) {
        const idx = store.companies.findIndex(c => c.id === existingId);
        if (idx >= 0) store.companies[idx] = companyRecord;
      } else {
        store.companies.unshift(companyRecord);
      }

      persistState();
      closeModal();
      showToast('Empresa salva com sucesso!', 'success');

      const cb = window.__companyFormCallback;
      window.__companyFormCallback = null;
      if (typeof cb === 'function') {
        cb(companyRecord);
      } else {
        renderCurrentView();
      }
    }

    function confirmDeleteCompany(companyId) {
      openModal(
        'Excluir empresa',
        `
          <p class="text-sm text-slate-700 dark:text-slate-300">Deseja excluir esta empresa? Ela poderá ser recuperada na Lixeira.</p>
          <div class="flex justify-end gap-2 pt-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">Cancelar</button>
            <button type="button" onclick="executeDeleteCompany('${escapeHTML(companyId)}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Excluir</button>
          </div>
        `
      );
    }

    function executeDeleteCompany(companyId) {
      const store = getActiveStore();
      const idx = (store.companies || []).findIndex(c => c.id === companyId);
      if (idx >= 0) {
        const [removed] = store.companies.splice(idx, 1);
        store.trash = store.trash || [];
        store.trash.unshift({
          trashId: generateId('tr'),
          entityType: 'company',
          deletedAt: new Date().toISOString(),
          label: removed.tradeName || removed.legalName,
          data: removed
        });
        persistState();
      }
      closeModal();
      renderCurrentView();
      showToast('Empresa movida para a Lixeira.', 'info');
    }

    function openQuickCompanyModal() {
      openCompanyFormModal(null, '', (createdCompany) => {
        const sel = document.getElementById('visitCompanySelect');
        if (sel) {
          const opt = document.createElement('option');
          opt.value = createdCompany.id;

          segSel.value = createdCompany.segment;

    function handleVisitCompanyChange(companyId) {
      const comp = getActiveStore().companies?.find(c => c.id === companyId);
      const segSel = document.getElementById('visitSegmentSelect');
      if (comp && comp.segment && segSel) {
        segSel.value = comp.segment;
        renderSegmentQuestionsChecklist(comp.segment);
      } else if (segSel && segSel.value) {
        renderSegmentQuestionsChecklist(segSel.value);
      }
      const contactInput = document.getElementById('visitContactInput');
      if (comp && comp.contactName && contactInput && !contactInput.value) {
        contactInput.value = comp.contactName;
      }
      saveDraftVisit(false);
    }

    function handleVisitSegmentChange(segment) {
      renderSegmentQuestionsChecklist(segment);
      saveDraftVisit(false);
    }

    function renderSegmentQuestionsChecklist(segment) {
      const box = document.getElementById('segmentQuestionsBox');
      const titleEl = document.getElementById('segmentQuestionsTitle');
      const listEl = document.getElementById('segmentQuestionsList');
      if (!box || !listEl) return;

      if (!segment || !SEGMENT_QUESTIONS[segment]) {
        box.classList.add('hidden');
        return;
      }
      const companyId = document.getElementById('visitCompanySelect')?.value || '';
      const company = (getActiveStore().companies || []).find(c => c.id === companyId) || null;
      const questions = getContextualQuestionsForCompany(segment, company);

      if (titleEl) {
        const suffix = company && Number(company.employees || 0) === 0 ? ' • Operação enxuta (0 func.)' : '';
        titleEl.textContent = `${segment}${suffix}`;
      }
      listEl.innerHTML = questions.map((q, idx) => `
        <label class="flex items-start gap-2 p-2 rounded-xl bg-white/90 dark:bg-slate-900/90 border border-tealCooper-100 dark:border-tealCooper-900 cursor-pointer">
          <input type="checkbox" class="mt-0.5 rounded" />
          <span class="text-slate-800 dark:text-slate-200 leading-snug"><strong>${idx + 1}.</strong> ${escapeHTML(q)}</span>
        </label>
      `).join('');
      box.classList.remove('hidden');
    }

    function saveVisitRecord(status = 'concluida') {
      const form = collectVisitFormData();
      if (!form.companyId) {
        showToast('Selecione ou cadastre uma empresa antes de salvar.', 'warn');
        return;
      }
      if (!form.segment) {
        showToast('Selecione o segmento da empresa.', 'warn');
        return;
      }

      const store = getActiveStore();
      store.visits = store.visits || [];
      store.opportunities = store.opportunities || [];
      store.commitments = store.commitments || [];

      const comp = (store.companies || []).find(c => c.id === form.companyId);
      if (comp && !comp.segment) comp.segment = form.segment;

      const existingIdx = editingVisitId ? store.visits.findIndex(v => v.id === editingVisitId) : -1;
      const visitId = existingIdx >= 0 ? store.visits[existingIdx].id : generateId('vis');
      const visitNumber = existingIdx >= 0 ? store.visits[existingIdx].visitNumber : (store.visits.length + 1);

      const record = {
        id: visitId,
        visitNumber,
        ...form,
        status
      };

      if (existingIdx >= 0) {
        store.visits[existingIdx] = record;
      } else {
        store.visits.push(record);
      }

      // Sincroniza compromisso e oportunidades quando concluída
      if (status === 'concluida') {
        if (form.actionPlan.nextAction) {
          const cmtIdx = store.commitments.findIndex(c => c.visitId === visitId);
          const cmtObj = {
            id: cmtIdx >= 0 ? store.commitments[cmtIdx].id : generateId('cmt'),
            visitId,
            companyId: form.companyId,
            description: form.actionPlan.nextAction,
            dueDate: form.actionPlan.suggestedDate,
            urgency: form.actionPlan.urgency,
            responsible: form.actionPlan.responsible,
            status: cmtIdx >= 0 ? store.commitments[cmtIdx].status : 'Pendente'
          };
          if (cmtIdx >= 0) store.commitments[cmtIdx] = cmtObj;
          else store.commitments.unshift(cmtObj);
        }

        const opps = form.commercialMapping.immediateOpportunities || [];
        if (opps.length > 0 || form.potentialValue > 0) {
          const prodTitle = opps.join(' / ') || 'Solução financeira PJ';
          const oppIdx = store.opportunities.findIndex(o => o.visitId === visitId);
          const oppObj = {
            id: oppIdx >= 0 ? store.opportunities[oppIdx].id : generateId('opp'),
            visitId,
            companyId: form.companyId,
            segment: form.segment,
            product: prodTitle,
            potentialValue: form.potentialValue,
            stage: oppIdx >= 0 ? store.opportunities[oppIdx].stage : 'Identificada',
            priority: form.actionPlan.urgency === 'D+1' ? 'Alta prioridade' : 'Média prioridade',
            responsible: form.actionPlan.responsible,
            dueDate: form.actionPlan.suggestedDate,
            status: 'Ativa'
          };
          if (oppIdx >= 0) store.opportunities[oppIdx] = oppObj;
          else store.opportunities.unshift(oppObj);
        }

        if (!editingVisitId) {
          appState.draftVisit = null;
          editingVisitId = null;
          tempAudioId = null;
          tempMediaIds = [];
        }
      }

      persistState();
      showToast(status === 'concluida' ? 'Visita salva com sucesso!' : 'Rascunho salvo!', 'success');
      navigateTo('historico');

      if (status === 'concluida') {
        openAssistantHandoffModal(record, comp);
      }
    }

    function executeDeleteVisit(visitId) {
      const store = getActiveStore();
      const idx = (store.visits || []).findIndex(v => v.id === visitId);
      if (idx >= 0) {
        const [removed] = store.visits.splice(idx, 1);
        store.opportunities = (store.opportunities || []).filter(o => o.visitId !== visitId);
        store.commitments = (store.commitments || []).filter(c => c.visitId !== visitId);
        store.trash = store.trash || [];
        store.trash.unshift({
          trashId: generateId('tr'),
          entityType: 'visit',
          deletedAt: new Date().toISOString(),
          label: `Visita #${removed.visitNumber} (${formatDateBR(removed.visitDate)})`,
          data: removed
        });
        if (editingVisitId === visitId) editingVisitId = null;
        persistState();
      }
      closeModal();
      renderCurrentView();
      showToast('Visita removida e indicadores atualizados.', 'info');
    }

              <p class="text-xs text-slate-500">Edição livre de todos os blocos da IA, cópia para CRM e exclusão com confirmação.</p>
            </div>
            <button type="button" onclick="navigateTo('nova-visita')" class="px-4 py-2 rounded-xl bg-tealCooper-600 text-white text-xs font-extrabold">+ Nova visita</button>
          </div>

          ${
            visits.length === 0
              ? `<div class="p-8 text-center text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">Nenhuma visita encontrada no período selecionado.</div>`
              : `<div class="space-y-3">
                  ${visits.map(v => {
                    const comp = (store.companies || []).find(c => c.id === v.companyId);
                    return `
                      <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 space-y-2.5">
                        <div class="flex flex-wrap items-start justify-between gap-2">
                          <div>
                            <div class="text-sm font-extrabold">${escapeHTML(comp?.tradeName || 'Empresa PJ')} <span class="text-xs font-bold text-tealCooper-700 dark:text-tealCooper-400">• ${escapeHTML(v.segment || '')}</span></div>
                            <div class="text-xs text-slate-500">Visita #${escapeHTML(v.visitNumber)} • ${formatDateBR(v.visitDate)} às ${escapeHTML(v.visitTime || '')} • ${escapeHTML(v.visitType)} • Resp: <strong>${escapeHTML(v.actionPlan?.responsible || 'Gerente')}</strong> (${escapeHTML(v.actionPlan?.urgency || 'D+3')})</div>
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <button type="button" onclick="openVisitForEdit('${escapeHTML(v.id)}')" class="px-3 py-1.5 rounded-xl bg-ailosBlue-600 text-white text-xs font-bold">Editar</button>
                            <button type="button" onclick="triggerAssistantHandoffById('${escapeHTML(v.id)}')" class="px-3 py-1.5 rounded-xl bg-tealCooper-600 text-white text-xs font-bold">👩‍💼 Assistente</button>
                            <button type="button" onclick="copyTextToClipboard(${JSON.stringify(v.crmText || '')}, 'Texto do CRM copiado!')" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs font-bold">CRM</button>
                            <button type="button" onclick="confirmDeleteVisit('${escapeHTML(v.id)}')" class="px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 text-xs font-bold">Excluir</button>
                          </div>
                        </div>
                        <div class="text-xs text-slate-700 dark:text-slate-300 whitespace-pre-line">${escapeHTML(v.executiveReport || v.rawText || '')}</div>
                        ${v.actionPlan?.nextAction ? `<div class="text-xs pt-1.5 border-t border-slate-200/70 dark:border-slate-700/70"><strong>Próxima ação:</strong> ${escapeHTML(v.actionPlan.nextAction)} • <span class="text-tealCooper-700 dark:text-tealCooper-400 font-bold">${formatDateBR(v.actionPlan.suggestedDate)}</span></div>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>`
          }
        </div>
      `;
    }

    function triggerAssistantHandoffById(visitId) {
      const store = getActiveStore();
      const visit = (store.visits || []).find(v => v.id === visitId);
      if (!visit) return;
      const comp = (store.companies || []).find(c => c.id === visit.companyId) || null;
      openAssistantHandoffModal(visit, comp);
    }

    // -------------------------------------------------------------------------
    // TELA 5: OPORTUNIDADES COMERCIAIS
    // -------------------------------------------------------------------------
    function renderOpportunitiesModule(container) {
      const store = getActiveStore();
      const opps = (store.opportunities || []).filter(o => o.status === 'Ativa');

              ? `<div class="p-8 text-center text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">Nenhuma oportunidade mapeada até o momento.</div>`
              : `<div class="space-y-2.5">
                  ${opps.map(o => {
                    const comp = (store.companies || []).find(c => c.id === o.companyId);

                </div>`

      `;

    // -------------------------------------------------------------------------
    // TELA 6: AGENDA DE RETORNOS
    // -------------------------------------------------------------------------
    function renderAgendaModule(container) {
      const store = getActiveStore();
      const commitments = store.commitments || [];

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4">
          <h2 class="text-lg font-extrabold">Agenda de retornos e plano de ação</h2>
          ${
            commitments.length === 0
              ? `<div class="p-8 text-center text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">Nenhum compromisso registrado.</div>`
              : `<div class="space-y-2.5">
                  ${commitments.map(c => {
                    const comp = (store.companies || []).find(x => x.id === c.companyId);
                    const done = c.status === 'Concluído';
                    const overdue = !done && c.dueDate && c.dueDate < getTodayISO();
                    return `
                      <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border ${overdue ? 'border-rose-300 dark:border-rose-800' : 'border-slate-200 dark:border-slate-800'} flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="text-sm font-extrabold">${escapeHTML(comp?.tradeName || 'Empresa PJ')}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${c.responsible === 'Assistente' ? 'bg-tealCooper-100 text-tealCooper-800' : 'bg-ailosBlue-100 text-ailosBlue-800'}">${escapeHTML(c.responsible)}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${done ? 'bg-emerald-100 text-emerald-800' : overdue ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}">${done ? 'Concluído' : overdue ? 'Atrasado' : 'Pendente'}</span>
                          </div>
                          <div class="text-xs mt-1">${escapeHTML(c.description)}</div>
                          <div class="text-[11px] text-slate-500">Data sugerida: <strong>${formatDateBR(c.dueDate)}</strong> (${escapeHTML(c.urgency || '')})</div>
                        </div>
                        ${!done ? `<button type="button" onclick="completeCommitment('${escapeHTML(c.id)}')" class="px-3 py-1.5 rounded-xl bg-tealCooper-600 text-white text-xs font-bold">Marcar concluído</button>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>`
          }
        </div>
      `;
    }

    function completeCommitment(cmtId) {
      const store = getActiveStore();
      const item = (store.commitments || []).find(c => c.id === cmtId);
      if (item) {
        item.status = 'Concluído';
        persistState();
        renderCurrentView();
        showToast('Compromisso concluído!', 'success');
      }
    }

    // -------------------------------------------------------------------------
    // TELA 7: RELATÓRIOS GERENCIAIS (REUNIÃO SEMANAL + MODOS 1 E 2 + FECHAMENTO)
    // -------------------------------------------------------------------------
    function renderReportsModule(container) {
      const store = getActiveStore();
      const baseVisits = getFilteredVisits();

      const segFilter = document.getElementById('repSegFilter')?.value || '';
      const respFilter = document.getElementById('repRespFilter')?.value || '';
      const statusFilter = document.getElementById('repStatusFilter')?.value || '';

      const filteredVisits = baseVisits.filter(v => {
        if (segFilter && v.segment !== segFilter) return false;
        if (respFilter && (v.actionPlan?.responsible || 'Gerente') !== respFilter) return false;
        if (statusFilter && (v.actionPlan?.actionStatus || 'Pendente') !== statusFilter) return false;
        return true;
      });

      const mode = appState.reportMode || 'executivo';

      // Contagem por segmento
      const segCounts = {};
      SEGMENTS_LIST.forEach(s => { segCounts[s] = 0; });
      filteredVisits.forEach(v => {
        const s = SEGMENTS_LIST.includes(v.segment) ? v.segment : 'Outros';
        segCounts[s] = (segCounts[s] || 0) + 1;
      });
      const maxSegCount = Math.max(1, ...Object.values(segCounts));

      // Contagem por responsável (Gerente vs Assistente)
      const gerenteTasks = filteredVisits.filter(v => (v.actionPlan?.responsible || 'Gerente') === 'Gerente').length;
      const assistenteTasks = filteredVisits.filter(v => v.actionPlan?.responsible === 'Assistente').length;

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 space-y-5 shadow-xs">
          <div class="no-print flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-800 pb-4">
            <div>
              <h2 class="text-lg font-extrabold">Relatórios Gerenciais — Reunião Semanal</h2>
              <p class="text-xs text-slate-500">Apresentação para o gestor ${escapeHTML(appState.settings.gestor || 'Rafael')} • ${escapeHTML(appState.settings.institution)} (${escapeHTML(appState.settings.unit)})</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="setReportMode('executivo')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${mode === 'executivo' ? 'bg-ailosBlue-700 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">
                Modo 1: Relatório Executivo
              </button>
              <button type="button" onclick="setReportMode('completo')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${mode === 'completo' ? 'bg-tealCooper-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">
                Modo 2: Completo + Gráficos
              </button>
              <button type="button" onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-extrabold">
                🖨 Imprimir / PDF
              </button>
            </div>
          </div>

          <!-- Filtros Dinâmicos do Relatório -->
          <div class="no-print grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div>
              <label class="block font-bold mb-1">Segmento</label>
              <select id="repSegFilter" onchange="renderCurrentView()" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <option value="">Todos os segmentos</option>
                ${SEGMENTS_LIST.map(s => `<option value="${escapeHTML(s)}" ${segFilter === s ? 'selected' : ''}>${escapeHTML(s)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1">Responsável</label>
              <select id="repRespFilter" onchange="renderCurrentView()" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <option value="">Gerente e Assistente</option>
                <option value="Gerente" ${respFilter === 'Gerente' ? 'selected' : ''}>Gerente (Eu)</option>
                <option value="Assistente" ${respFilter === 'Assistente' ? 'selected' : ''}>Assistente</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1">Status da ação</label>
              <select id="repStatusFilter" onchange="renderCurrentView()" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                <option value="">Todos os status</option>
                <option value="Pendente" ${statusFilter === 'Pendente' ? 'selected' : ''}>Pendente</option>
                <option value="Em andamento" ${statusFilter === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                <option value="Concluído" ${statusFilter === 'Concluído' ? 'selected' : ''}>Concluído</option>
              </select>
            </div>
          </div>

          <!-- Cabeçalho de Apresentação -->
          <div class="p-4 rounded-2xl bg-gradient-to-r from-ailosBlue-700 to-tealCooper-700 text-white flex flex-wrap items-center justify-between gap-3">
            <div>
              <div class="text-xs uppercase tracking-wider opacity-85">Apresentação Gerencial • ${escapeHTML(appState.settings.unit)}</div>
              <div class="text-base font-extrabold">${mode === 'executivo' ? 'Relatório Executivo de Visitas PJ' : 'Relatório Completo + Indicadores Visuais'}</div>
            </div>
            <div class="text-right text-xs">
              <div><strong>Gerente:</strong> ${escapeHTML(appState.settings.managerName)}</div>
              <div><strong>Visitas filtradas:</strong> ${filteredVisits.length}</div>
            </div>
          </div>

          ${
            mode === 'completo'
              ? `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2.5">
                    <div class="text-xs font-extrabold uppercase text-ailosBlue-700 dark:text-sky-400">Visitas por segmento</div>
                    ${SEGMENTS_LIST.map(seg => {
                      const cnt = segCounts[seg] || 0;
                      const pct = Math.round((cnt / maxSegCount) * 100);
                      return `
                        <div class="space-y-1 text-xs">
                          <div class="flex justify-between font-semibold"><span>${escapeHTML(seg)}</span><span>${cnt}</span></div>
                          <div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                            <div class="h-full bg-tealCooper-600 rounded-full" style="width:${pct}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <div class="text-xs font-extrabold uppercase text-ailosBlue-700 dark:text-sky-400">Tarefas por responsável & Funil de oportunidades</div>
                    <div class="grid grid-cols-2 gap-3">
                      <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                        <div class="text-[11px] text-slate-500 font-bold">Gerente (Eu)</div>
                        <div class="text-xl font-extrabold text-ailosBlue-700 dark:text-sky-400">${gerenteTasks}</div>
                      </div>
                      <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                        <div class="text-[11px] text-slate-500 font-bold">Assistente</div>
                        <div class="text-xl font-extrabold text-tealCooper-700 dark:text-tealCooper-400">${assistenteTasks}</div>
                      </div>
                    </div>
                    <div class="space-y-1.5 text-xs pt-1">
                      <div class="font-bold">Produtos mapeados no período:</div>
                      ${
                        filteredVisits.flatMap(v => v.commercialMapping?.immediateOpportunities || []).length === 0
                          ? `<div class="text-slate-500">Nenhuma oportunidade mapeada no recorte atual.</div>`
                          : filteredVisits.flatMap(v => v.commercialMapping?.immediateOpportunities || []).map(p =>
                              `<span class="inline-block mr-1.5 mb-1 px-2.5 py-1 rounded-full bg-tealCooper-100 text-tealCooper-800 font-bold">${escapeHTML(p)}</span>`
                            ).join('')
                      }
                    </div>
                  </div>
                </div>`
              : ''
          }

          <!-- Lista Consolidada de Visitas e Próximos Passos -->
          <div class="space-y-3">
            <h3 class="text-sm font-extrabold">Visitas, oportunidades e próximos passos (${filteredVisits.length})</h3>
            ${
              filteredVisits.length === 0
                ? `<div class="p-6 text-center text-xs text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">Nenhum registro encontrado para os filtros selecionados.</div>`
                : filteredVisits.map(v => {
                    const comp = (store.companies || []).find(c => c.id === v.companyId);
                    const imm = (v.commercialMapping?.immediateOpportunities || []).join(', ') || 'A mapear';
                    return `
                      <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 space-y-2">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                          <div class="text-sm font-extrabold">${escapeHTML(comp?.tradeName || 'Empresa PJ')} <span class="text-xs font-bold text-tealCooper-700 dark:text-tealCooper-400">(${escapeHTML(v.segment || '')})</span></div>
                          <span class="text-xs font-semibold text-slate-500">${formatDateBR(v.visitDate)} • ${escapeHTML(v.visitType)}</span>
                        </div>
                        <div class="text-xs whitespace-pre-line text-slate-700 dark:text-slate-300">${escapeHTML(v.executiveReport || v.rawText || '')}</div>
                        <div class="text-xs"><strong>Oportunidades imediatas:</strong> ${escapeHTML(imm)}</div>
                        ${mode === 'completo' && v.commercialMapping?.strategicConsulting ? `<div class="text-xs text-tealCooper-800 dark:text-tealCooper-300"><strong>Consultoria estratégica:</strong> ${escapeHTML(v.commercialMapping.strategicConsulting)}</div>` : ''}
                        <div class="text-xs pt-1 border-t border-slate-200/70 dark:border-slate-700/70">
                          <strong>Próxima ação (${escapeHTML(v.actionPlan?.urgency || 'D+3')} • ${formatDateBR(v.actionPlan?.suggestedDate)} • Resp: ${escapeHTML(v.actionPlan?.responsible || 'Gerente')}):</strong>
                          ${escapeHTML(v.actionPlan?.nextAction || 'Acompanhar retorno')}
                        </div>
                      </div>
                    `;
                  }).join('')
            }
          </div>
        </div>
      `;
    }

    function setReportMode(mode) {
      appState.reportMode = mode;
      persistState();
      renderCurrentView();
    }

    function openDailyClosingModal() {
      const store = getActiveStore();
      const today = getTodayISO();
      const todayVisits = (store.visits || []).filter(v => v.status === 'concluida' && v.visitDate === today);
      const prosp = todayVisits.filter(v => v.visitType === 'Prospecção').length;
      const maint = todayVisits.filter(v => v.visitType === 'Manutenção de cooperado').length;
      const opps = todayVisits.flatMap(v => v.commercialMapping?.immediateOpportunities || []);

      const summaryText = [
        `Boa tarde, ${appState.settings.gestor || 'Rafael'}!`,
        `Fechamento comercial (${formatDateBR(today)}):`,
        `Visitas realizadas: ${todayVisits.length} (Prospecção: ${prosp} | Manutenção: ${maint})`,
        `Oportunidades imediatas: ${opps.length ? opps.join(', ') : 'Nenhuma mapeada hoje'}`,
        todayVisits.length
          ? `Próximos passos:\n${todayVisits.map(v => `- ${(store.companies.find(c => c.id === v.companyId)?.tradeName || 'PJ')}: ${v.actionPlan?.nextAction || 'Retorno'} (${formatDateBR(v.actionPlan?.suggestedDate)} • ${v.actionPlan?.responsible || 'Gerente'})`).join('\n')}`
          : 'Sem visitas concluídas na data.'
      ].join('\n');

      openModal(
        `Fechamento do dia — ${formatDateBR(today)}`,
        `
          <div class="space-y-3">
            <p class="text-xs text-slate-500">Revise e copie o resumo para encaminhar ao gestor ${escapeHTML(appState.settings.gestor || 'Rafael')}.</p>
            <textarea id="dailyClosingText" rows="10" class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">${escapeHTML(summaryText)}</textarea>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">Fechar</button>
              <button type="button" onclick="copyTextToClipboard(document.getElementById('dailyClosingText').value, 'Fechamento do dia copiado!')" class="px-4 py-2 rounded-xl bg-tealCooper-600 text-white text-xs font-extrabold">📋 Copiar resumo</button>
            </div>
          </div>
        `
      );
    }

    // -------------------------------------------------------------------------
    // TELA 8: CONFIGURAÇÕES, MODO DEMONSTRAÇÃO E LIXEIRA

    function restoreTrashItem(trashId) {
      const store = getActiveStore();
      const idx = (store.trash || []).findIndex(t => t.trashId === trashId);
      if (idx < 0) return;
      const [item] = store.trash.splice(idx, 1);
      if (item.entityType === 'company') {
        store.companies = store.companies || [];
        store.companies.unshift(item.data);
      } else if (item.entityType === 'visit') {
        store.visits = store.visits || [];
        store.visits.push(item.data);
        if (item.data.actionPlan?.nextAction) {
          store.commitments = store.commitments || [];
          store.commitments.unshift({
            id: generateId('cmt'),
            visitId: item.data.id,
            companyId: item.data.companyId,
            description: item.data.actionPlan.nextAction,
            dueDate: item.data.actionPlan.suggestedDate,
            urgency: item.data.actionPlan.urgency,
            responsible: item.data.actionPlan.responsible,
            status: 'Pendente'
          });
        }
      }
      persistState();
      renderCurrentView();
      showToast('Registro restaurado!', 'success');
    }

    function purgeTrashItem(trashId) {
      const store = getActiveStore();
      store.trash = (store.trash || []).filter(t => t.trashId !== trashId);
      persistState();
      renderCurrentView();
      showToast('Registro excluído permanentemente.', 'info');
    }

    async function buildBackupPayloadAsync() {
      const now = getNowSP();
      const prod = appState.production || createEmptyStore();
      const demo = appState.demo || createEmptyStore();
      const activeStore = getActiveStore();

      const embeddedPhotos = [];
      const seenPhotoIds = new Set();

      const collectPhotosFromVisits = async (visitsList = [], envName = 'production') => {
        for (const v of visitsList) {
          const ids = Array.isArray(v.mediaIds) ? v.mediaIds : [];
          for (const medId of ids) {
            if (!medId || seenPhotoIds.has(medId)) continue;
            try {
              const item = await getMediaFromDB(medId);
              if (item && item.blob && String(item.mimeType || item.blob.type || '').startsWith('image/')) {
                const dataUrl = await compressImageBlobToDataUrl(item.blob, 1024, 0.72);
                embeddedPhotos.push({
                  id: item.id,
                  visitId: v.id,
                  env: envName,
                  name: item.name || 'foto-visita.jpg',
                  mime: 'image/jpeg',
                  dataUrl,
                  createdAt: item.createdAt || Date.now()
                });
                seenPhotoIds.add(medId);
              }
            } catch (err) {
              console.warn('Ignorando mídia não serializável no backup:', medId, err);
            }
          }
        }
      };

      await collectPhotosFromVisits(prod.visits || [], 'production');
      await collectPhotosFromVisits(demo.visits || [], 'demo');

      const activePhotosCount = embeddedPhotos.filter(p => p.env === (appState.demoMode ? 'demo' : 'production')).length;

      return {
        app: 'GestaoInteligenteVisitasPJ_CredFoz',
        version: '2.1',
        exportedAtISO: new Date().toISOString(),
        exportedAtBR: `${formatDateBR(now.isoDate)} ${now.time}`,
        environment: appState.demoMode ? 'demo' : 'production',
        summary: {
          companiesCount: (activeStore.companies || []).length,
          visitsCount: (activeStore.visits || []).length,
          opportunitiesCount: (activeStore.opportunities || []).length,
          commitmentsCount: (activeStore.commitments || []).length,
          photosCount: activePhotosCount
        },
        settings: appState.settings,
        production: prod,
        demo: demo,
        embeddedPhotos
      };
    }

    async function downloadOrShareBackupFile() {
      let jsonStr = window.__currentBackupJson;
      if (!jsonStr) {
        const payload = await buildBackupPayloadAsync();
        jsonStr = JSON.stringify(payload);
        window.__currentBackupJson = jsonStr;
      }
      const fileName = `backup-visitas-pj-${getTodayISO()}.json`;
      const blob = new Blob([jsonStr], { type: 'application/json' });

      // No iPhone/Safari, aciona o menu nativo de compartilhamento (Salvar em Arquivos / WhatsApp) se disponível
      try {
        const file = new File([blob], fileName, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          await navigator.share({
            files: [file],
            title: 'Backup Visitas PJ — CredFoz',
            text: 'Backup completo dos cadastros, visitas e fotos PJ.'
          });
          showToast('Arquivo de backup compartilhado/salvo!', 'success');
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }

      // Fallback universal: download direto do arquivo .json
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast(`Arquivo ${fileName} baixado!`, 'success');
    }

    function handleBackupFileSelected(inputEl) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      const labelEl = document.getElementById('backupFileSelectedLabel');
      if (labelEl) labelEl.textContent = `⏳ Lendo ${file.name}...`;

      const reader = new FileReader();
      reader.onload = () => {
        const textarea = document.getElementById('restoreBackupTextInput');
        if (textarea) textarea.value = String(reader.result || '');
        if (labelEl) labelEl.textContent = `✅ Arquivo carregado: ${file.name}`;
      };
      reader.onerror = () => {
        if (labelEl) labelEl.textContent = '❌ Erro ao ler o arquivo selecionado.';
      };
      reader.readAsText(file);
    }

    function mergeEntityLists(currentList = [], incomingList = []) {
      const map = new Map();
      currentList.forEach(item => {
        if (item && item.id) map.set(item.id, item);
      });
      incomingList.forEach(item => {
        if (item && item.id) {
          map.set(item.id, item);
        } else if (item) {
          map.set(generateId('imp'), item);
        }
      });
      return Array.from(map.values());
    }

    async function executeRestoreBackup() {
      const raw = document.getElementById('restoreBackupTextInput')?.value?.trim() || '';
      if (!raw) {
        showToast('Selecione um arquivo .json ou cole o código do backup antes de restaurar.', 'warn');
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        showToast('O texto ou arquivo informado não é um JSON de backup válido.', 'error');
        return;
      }

      if (!parsed || typeof parsed !== 'object' || (!parsed.production && !parsed.demo && !parsed.companies)) {
        showToast('Estrutura de backup não reconhecida.', 'error');
        return;
      }

      const mode = document.querySelector('input[name="restoreModeOption"]:checked')?.value || 'merge';
      const incomingProd = parsed.production || (parsed.companies ? {
        companies: parsed.companies || [],
        visits: parsed.visits || [],
        opportunities: parsed.opportunities || [],
        commitments: parsed.commitments || [],
        trash: parsed.trash || []
      } : createEmptyStore());
      const incomingDemo = parsed.demo || createEmptyStore();

      if (mode === 'replace') {
        appState.production = {
          companies: incomingProd.companies || [],
          visits: incomingProd.visits || [],
          opportunities: incomingProd.opportunities || [],
          commitments: incomingProd.commitments || [],
          trash: incomingProd.trash || []
        };
        appState.demo = {
          companies: incomingDemo.companies || [],
          visits: incomingDemo.visits || [],
          opportunities: incomingDemo.opportunities || [],
          commitments: incomingDemo.commitments || [],
          trash: incomingDemo.trash || []
        };
        if (parsed.settings) {
          appState.settings = { ...appState.settings, ...parsed.settings };
        }
      } else {
        appState.production = {
          companies: mergeEntityLists(appState.production.companies, incomingProd.companies),
          visits: mergeEntityLists(appState.production.visits, incomingProd.visits),
          opportunities: mergeEntityLists(appState.production.opportunities, incomingProd.opportunities),
          commitments: mergeEntityLists(appState.production.commitments, incomingProd.commitments),
          trash: mergeEntityLists(appState.production.trash, incomingProd.trash)
        };
        appState.demo = {
          companies: mergeEntityLists(appState.demo.companies, incomingDemo.companies),
          visits: mergeEntityLists(appState.demo.visits, incomingDemo.visits),
          opportunities: mergeEntityLists(appState.demo.opportunities, incomingDemo.opportunities),
          commitments: mergeEntityLists(appState.demo.commitments, incomingDemo.commitments),
          trash: mergeEntityLists(appState.demo.trash, incomingDemo.trash)
        };
      }

      // Restaura as fotos comprimidas embutidas de volta para o IndexedDB e garante vínculo nas visitas
      let restoredPhotosCount = 0;
      const embeddedPhotos = Array.isArray(parsed.embeddedPhotos) ? parsed.embeddedPhotos : [];
      for (const photo of embeddedPhotos) {
        if (!photo || !photo.id || !photo.dataUrl) continue;
        try {
          const blob = dataUrlToBlob(photo.dataUrl, photo.mime || 'image/jpeg');
          await saveMediaFileWithIdToDB(
            photo.id,
            blob,
            photo.name || 'foto-visita.jpg',
            photo.mime || 'image/jpeg',
            photo.createdAt || Date.now()
          );
          restoredPhotosCount += 1;

          if (photo.visitId) {
            const targetStores = [appState.production, appState.demo];
            targetStores.forEach(st => {
              const v = (st.visits || []).find(item => item.id === photo.visitId);
              if (v) {
                v.mediaIds = Array.isArray(v.mediaIds) ? v.mediaIds : [];
                if (!v.mediaIds.includes(photo.id)) {
                  v.mediaIds.push(photo.id);
                }
              }
            });
          }
        } catch (err) {
          console.warn('Erro ao restaurar foto do backup:', photo.id, err);
        }
      }

      persistState();
      const active = getActiveStore();
      const totalEmpresas = (active.companies || []).length;
      const totalVisitas = (active.visits || []).length;

      closeModal();
      renderCurrentView();
      showToast(`Backup restaurado! (${totalEmpresas} empresa(s), ${totalVisitas} visita(s) e ${restoredPhotosCount} foto(s))`, 'success');
    }

    // =========================================================================
    // 10. MODAIS, TEMA E TOASTS
    // =========================================================================
    function openModal(title, htmlContent) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = htmlContent;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
      document.getElementById('modalBody').innerHTML = '';
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const colorMap = {
        success: 'bg-tealCooper-700 text-white',
        warn: 'bg-amber-400 text-slate-950',
        error: 'bg-rose-600 text-white',
        info: 'bg-ailosBlue-700 text-white'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold ${colorMap[type] || colorMap.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.remove();
      }, 3200);
    }

    function toggleDarkMode() {
      appState.darkMode = !appState.darkMode;
      applyThemeClass();
      persistState();
    }

    function applyThemeClass() {
      document.documentElement.classList.toggle('dark', Boolean(appState.darkMode));
    }

    // Inicialização
    window.addEventListener('DOMContentLoaded', async () => {
      applyThemeClass();
      await hydrateStateFromIndexedDB();
      applyThemeClass();
      appState.globalPeriod = appState.settings.defaultPeriod || appState.globalPeriod || 'hoje';
      updateNavActiveState();
      renderCurrentView();
    });
  </script>
</body>
</html>
